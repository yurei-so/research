[project]
name = "yurei-mujoco-lab"
version = "0.1.0"
description = "Shared deterministic physics apparatus for Yurei Labs"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mujoco==3.9.0", "numpy==2.2.4"]

[project.scripts]
yurei-mujoco-lab = "yurei_mujoco_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yurei_mujoco_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
