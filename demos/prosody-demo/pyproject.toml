[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prosody-demo"
version = "0.1.0"
description = "A small A/B conversational turn-taking demo powered by Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "conversation-prosody-pipeline @ git+https://github.com/yurei-dll/conversation-prosody-pipeline.git@b346620",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.2,<2"]

[project.scripts]
prosody-demo = "prosody_demo.server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/prosody_demo"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE"]
