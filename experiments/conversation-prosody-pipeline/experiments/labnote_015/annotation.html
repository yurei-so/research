<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prosody 015 annotation</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#090a10;color:#e5e5ed}body{max-width:780px;margin:auto;padding:42px 22px 80px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid #2d3040;padding-bottom:18px}h1{margin:0;font-size:2rem}.muted{color:#999dac}.card{margin-top:28px;background:#11131b;border:1px solid #303343;padding:22px}audio{width:100%;margin:14px 0}fieldset{border:0;padding:0;margin:22px 0}legend,label{display:block;margin:8px 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}.choices label{display:flex;gap:8px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}select,input[type=text],textarea{width:100%;box-sizing:border-box;background:#090a10;color:#eee;border:1px solid #3b3e50;padding:10px}button{background:#9468ed;color:white;border:0;padding:12px 18px;font-weight:700}button:disabled{opacity:.45}.error{color:#ff9ea9}.hidden{display:none}@media(max-width:600px){.scores,.choices{grid-template-columns:1fr}}</style></head>
<body><header><div><p class="muted">PRIVATE OWNER-LOCAL ANNOTATION</p><h1>What did the voice actually do?</h1></div><strong id="progress">—</strong></header>
<section id="work" class="card hidden"><p id="ordinal" class="muted"></p><p id="transcript"></p><audio id="audio" controls preload="metadata"></audio>
<label>What word or phrase sounds most emphasized?<input id="focus" type="text" maxlength="80" placeholder="e.g. again, bicycle, none, uncertain"></label>
<fieldset><legend>Speech act</legend><div id="acts" class="choices"></div></fieldset><fieldset><legend>Affect</legend><div id="affects" class="choices"></div></fieldset>
<div class="scores"><label>Intensity<select id="intensity"></select></label><label>Naturalness<select id="naturalness"></select></label><label>Confidence<select id="confidence"></select></label></div>
<label>Optional observation<textarea id="notes" maxlength="500" rows="3"></textarea></label><p id="error" class="error"></p><button id="save">Lock annotation</button></section>
<section id="done" class="card hidden"><h2>All annotations are locked.</h2><p>The reveal mapping remains separate and owner-only.</p></section>
<script>let current;const $=s=>document.querySelector(s);function checks(root,values){root.replaceChildren(...values.map(v=>{const l=document.createElement('label');l.innerHTML=`<input type="checkbox" value="${v}">${v.replaceAll('-',' ')}`;return l}))}function scores(range){for(const id of ['intensity','naturalness','confidence']){$('#'+id).replaceChildren(...Array.from({length:range[1]-range[0]+1},(_,i)=>{const o=document.createElement('option');o.value=String(i+range[0]);o.textContent=String(i+range[0]);return o}));$('#'+id).value='3'}}function render(s){current=s.item;$('#progress').textContent=`${s.progress.completed}/${s.progress.total}`;if(s.complete){$('#work').classList.add('hidden');$('#done').classList.remove('hidden');$('#done h2').textContent=`All ${s.progress.total} annotations are locked.`;return}document.querySelector('h1').textContent=s.title;$('#work').classList.remove('hidden');$('#ordinal').textContent=`CLIP ${s.item.ordinal}`;$('#transcript').textContent=s.item.transcript;$('#audio').src=s.item.audio;$('#focus').value='';$('#notes').value='';checks($('#acts'),s.speech_acts);checks($('#affects'),s.affects);scores(s.score_range);$('#error').textContent=''}async function load(){render(await(await fetch('/api/session')).json())}$('#save').onclick=async()=>{const selected=id=>[...document.querySelectorAll(`#${id} input:checked`)].map(x=>x.value);const body={item_id:current.item_id,perceived_focus:$('#focus').value,speech_acts:selected('acts'),affects:selected('affects'),intensity:Number($('#intensity').value),naturalness:Number($('#naturalness').value),confidence:Number($('#confidence').value),notes:$('#notes').value};$('#save').disabled=true;const r=await fetch('/api/annotations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const v=await r.json();$('#save').disabled=false;if(!r.ok){$('#error').textContent=v.error;return}render(v)};load();</script></body></html>
