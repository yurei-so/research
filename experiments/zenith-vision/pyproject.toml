[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zenith-vision"
version = "0.1.0.dev0"
description = "Experiment-first perception and telemetry fusion for Guild Wars 2"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yūrei.so" }]
dependencies = ["numpy>=2,<3", "Pillow>=11,<13"]

[project.optional-dependencies]
vision-experiments = ["scikit-learn>=1.7,<2"]
transfer-experiments = ["torch>=2.6,<3", "torchvision>=0.21,<1"]

[tool.setuptools.packages.find]
where = ["src"]
